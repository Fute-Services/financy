# The two deployables sit at the root under the names they are called by, so a
# path in a stack trace or a CI log says which half of the system it came from
# without anyone having to remember that `web` meant the frontend.
packages:
  - 'frontend'
  - 'backend'
  - 'packages/*'
  - 'tests'

# Packages permitted to run install scripts. The default is to run none, so
# anything needing a postinstall is listed here deliberately rather than by
# blanket approval.
allowBuilds:
  # esbuild fetches a platform binary in its postinstall. It is a direct
  # dependency of Vitest, so the test runner does not work without it.
  esbuild: true
  # Prisma downloads its query engine binary and generates the client in a
  # postinstall. Without it, `@prisma/client` imports fail at runtime.
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  # @swc/core downloads a platform-native binary. Vitest needs it to emit the
  # decorator metadata NestJS dependency injection is built on.
  '@swc/core': true
  # argon2 compiles or downloads a native binding in its postinstall. Password
  # hashing does not work without it.
  argon2: true

# Transitive dependencies pinned above a published advisory. Each entry is a
# vulnerability the direct dependency has not yet picked up itself; remove one
# once its parent ships a fixed range, and never add one without the advisory
# id in the comment.
overrides:
  # GHSA-7fh5-64p2-3v2j / GHSA-r28c-9q8g-f849 — reached via next.
  postcss: '^8.5.26'
  # GHSA-ggr8-5vv4-36mx — stack exhaustion, reached via prisma.
  deepmerge-ts: '^8.0.2'
  # GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 — dev
  # server file-read advisories, reached via vitest. Test tooling only and
  # never shipped, but the dev server binds a port on a laptop that is also on
  # somebody else's network.
  vite: '^6.4.3'
  # GHSA-67mh-4wv8-2f99 — same reach, same reason. The advisory names 0.24.3
  # as the fix and no such release exists: 0.24.2 is the last of that line and
  # 0.25.0 the first one carrying it.
  esbuild: '^0.25.0'
