# SonarCloud, read by the scan action in `.github/workflows/code-scan.yml`.
#
# `organization` and `projectKey` are the two values SonarCloud assigns when
# the project is created; they are not secrets and belong in the repository
# rather than in the workflow, so a fork or a local `sonar-scanner` run
# analyses the same project shape.

sonar.projectKey=Fute-Services_financy
sonar.organization=fute-services
sonar.projectName=Financy
sonar.projectVersion=0.1.0

# What to read. `dist` and `.next` are build output, and analysing generated
# code produces findings nobody can act on in the source that produced it.
sonar.sources=backend/src,frontend/src,packages,scripts
sonar.tests=backend/test,tests/specs
sonar.exclusions=**/dist/**,**/.next/**,**/node_modules/**,**/*.d.ts,packages/*/dist/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage comes from the vitest run in the same job. Sonar cannot produce it
# itself, and a quality gate with a coverage condition and no report fails for
# the wrong reason.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,packages/core/coverage/lcov.info
sonar.sourceEncoding=UTF-8
